name: Sync from Gitee

on:
  push:
    branches:
      - master
  schedule:
    # GitHub Actions 使用 UTC；每小时第 17 分钟检查一次
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-from-gitee
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Fetch and merge Gitee master
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add gitee https://gitee.com/xyzqwefd/Yunzai-MCP-plugin.git

          # Gitee 偶发限流/网络失败时指数退避重试，并限制单次 fetch 时长
          fetched=false
          for attempt in 1 2 3; do
            if timeout 180 git fetch --prune gitee master; then
              fetched=true
              break
            fi
            case "$attempt" in
              1) sleep 60 ;;
              2) sleep 300 ;;
            esac
          done
          if [ "$fetched" != true ]; then
            echo "无法拉取 Gitee master，已重试 3 次"
            exit 1
          fi

          # 源提交已经包含在当前分支时，无需重复合并
          if git merge-base --is-ancestor gitee/master HEAD; then
            echo "Gitee 没有新的提交"
            exit 0
          fi

          # 使用合并而不是 force-push，保留本工作流和 GitHub 侧必要文件
          git merge --no-edit --no-ff gitee/master -m "chore: sync from Gitee"
          git push origin HEAD:master
